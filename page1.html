<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starlink - Fast, affordable internet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: #000;
      color: #fff;
      height: 100dvh;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('images/background_top.webp');
      background-size: cover;
      background-position: center top;
      z-index: 0;
    }

    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.05) 0%,
        rgba(0,0,0,0.1) 40%,
        rgba(0,0,0,0.75) 70%,
        rgba(0,0,0,0.95) 100%
      );
    }

    nav {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 20px;
    }

    .nav-logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
      text-transform: uppercase;
    }

    .hamburger {
      width: 46px;
      height: 46px;
      background: rgba(60,60,60,0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      border: none;
    }

    .hamburger span {
      display: block;
      width: 18px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      margin-top: auto;
      padding: 0 20px 28px;
    }

    .hero-content h1 {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.7);
      font-weight: 300;
      margin-bottom: 24px;
    }

    .starting-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      margin-bottom: 4px;
    }

    .price-display {
      font-size: 3.8rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 32px;
    }

    .price-display .period {
      font-size: 1.6rem;
      font-weight: 300;
    }

    .cta-btn {
      display: block;
      width: 100%;
      padding: 18px;
      background: #fff;
      color: #000;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: opacity 0.2s;
    }

    .cta-btn:hover { opacity: 0.9; }

    @media (min-width: 500px) {
      .hero-content h1 { font-size: 3rem; }
      .price-display { font-size: 4.5rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero-bg"></div>

    <nav>
      <div class="nav-logo">Starlink</div>
      <button class="hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>

    <div class="hero-content">
      <h1>Fast, affordable internet</h1>
      <p class="sub">No upfront hardware cost in select areas.</p>
      <p class="starting-label">Starting at</p>
      <div class="price-display">R 497</div>
      <a href="page2.html" class="cta-btn">Get Started</a>
    </div>
  </div>
</body>
</html>
